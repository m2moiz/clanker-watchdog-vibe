<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Clanker Watchdog for Vibe</title>
  <desc id="desc">A native browser acceptance verifier for Mistral Vibe</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a08"/>
      <stop offset="0.58" stop-color="#18100b"/>
      <stop offset="1" stop-color="#2b1106"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4f00"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <circle cx="1100" cy="110" r="150" fill="#ff5a00" opacity=".09" filter="url(#glow)"/>
  <circle cx="120" cy="570" r="190" fill="#ffb000" opacity=".06" filter="url(#glow)"/>
  <g opacity=".15" stroke="#ff8a28">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280"/>
    <path d="M80 0V640M160 0V640M240 0V640M320 0V640M400 0V640M480 0V640M560 0V640M640 0V640M720 0V640M800 0V640M880 0V640M960 0V640M1040 0V640M1120 0V640M1200 0V640"/>
  </g>
  <rect x="64" y="58" width="222" height="38" rx="19" fill="#ff6500"/>
  <text x="175" y="83" text-anchor="middle" fill="#160a03" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">MISTRAL · TRACK 2</text>
  <text x="64" y="190" fill="#fff8ef" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="800" letter-spacing="-3">Clanker Watchdog</text>
  <text x="64" y="258" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="750" letter-spacing="-2">for Vibe</text>
  <text x="64" y="328" fill="#d8c9bc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26">Don't trust the clanker. Watch it work.</text>
  <g transform="translate(64 392)">
    <rect width="1152" height="174" rx="18" fill="#0a0807" stroke="#5a3926"/>
    <circle cx="28" cy="26" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="26" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="26" r="6" fill="#27c93f"/>
    <text x="28" y="78" fill="#8d7c70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">$ vibe</text>
    <text x="28" y="112" fill="#f6eee7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Watching application: http://localhost:3000</text>
    <text x="28" y="146" fill="#5ef08a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">PASS · 4 flows tested · 0 reproduced failures</text>
    <rect x="1042" y="50" width="74" height="74" rx="20" fill="#ff6500"/>
    <path d="M1062 89l13 13 24-29" fill="none" stroke="#160a03" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
