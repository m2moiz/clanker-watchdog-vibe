<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="250" viewBox="0 0 1120 250" role="img" aria-labelledby="title desc">
  <title id="title">Closed-loop verification</title>
  <desc id="desc">Vibe builds, watches, repairs, and replays until the journey passes</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4f00"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L9 3L0 6Z" fill="#ff7a00"/>
    </marker>
  </defs>
  <rect width="1120" height="250" rx="24" fill="#11100f"/>
  <path d="M216 105H320M472 105H576M728 105H832" stroke="url(#line)" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M910 165C910 224 394 228 394 165" fill="none" stroke="#72513b" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(52 55)">
      <rect width="164" height="100" rx="18" fill="#211a15" stroke="#6d4931"/>
      <text x="82" y="44" fill="#ffad66" font-size="16" font-weight="700">01 · BUILD</text>
      <text x="82" y="70" fill="#fff8ef" font-size="18">Change the app</text>
    </g>
    <g transform="translate(308 55)">
      <rect width="164" height="100" rx="18" fill="#30180d" stroke="#ff6500"/>
      <text x="82" y="44" fill="#ff8a3d" font-size="16" font-weight="700">02 · WATCH</text>
      <text x="82" y="70" fill="#fff8ef" font-size="18">Drive the browser</text>
    </g>
    <g transform="translate(564 55)">
      <rect width="164" height="100" rx="18" fill="#2c1313" stroke="#f05252"/>
      <text x="82" y="44" fill="#ff7d7d" font-size="16" font-weight="700">03 · REPAIR</text>
      <text x="82" y="70" fill="#fff8ef" font-size="18">Use real evidence</text>
    </g>
    <g transform="translate(820 55)">
      <rect width="248" height="100" rx="18" fill="#10271a" stroke="#45c86b"/>
      <text x="124" y="44" fill="#69e28d" font-size="16" font-weight="700">04 · REPLAY</text>
      <text x="124" y="70" fill="#fff8ef" font-size="18">Prove user success ✓</text>
    </g>
  </g>
